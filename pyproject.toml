[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msview"
version = "0.1.0"
description = "Lightweight viewer for Thermo .raw and mzML LC-MS files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
thermo = ["pythonnet>=3.0"]
unidec = ["unidec>=9.0"]
dev = ["pytest>=8"]

[project.scripts]
msview = "msview.__main__:main"

[tool.setuptools.packages.find]
include = ["msview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
